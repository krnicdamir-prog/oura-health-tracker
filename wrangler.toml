name = "oura-health-tracker"
main = "src/index.js"
compatibility_date = "2026-11-18"
keep_vars = true
preview_urls = false

[vars]
APP_ORIGIN = "https://oura-health-tracker.krnic-damir.workers.dev"
OURA_LIVE = "true"

[triggers]
crons = ["*/15 * * * *"]

[observability]
enabled = false

[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "oura-health-db"
database_id = "0e29a8d5-3ae7-4a4e-b407-e8c05f09ed93"
