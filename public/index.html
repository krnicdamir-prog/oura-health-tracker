<!doctype html>
<html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f8fa"><title>Oura Health Tracker</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#17202c;background:#f7f8fa;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #3682ff;outline-offset:2px}.wrap{max-width:1650px;margin:auto;padding:27px 32px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}.brand{font-size:28px;font-weight:750;letter-spacing:-1px}.sub{font-size:13px;color:#667587;margin-top:6px}.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.pill{font-size:12px;font-weight:700;background:#fff4dd;color:#8a6014;padding:8px 12px;border-radius:30px;border:1px solid #eadab7}.btn{background:#fff;border:1px solid #dce2e9;border-radius:11px;padding:10px 14px;color:#30445d}.btn.primary{background:#215bd8;color:white;border-color:#215bd8}.btn.active{background:#eaf1ff;color:#2056ca;border-color:#c2d4ff}.notice{background:#fff;border:1px solid #e1e7ee;border-left:4px solid #e7ae44;padding:13px 16px;border-radius:12px;margin:22px 0 23px;font-size:13px;color:#586675;line-height:1.5}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:20px 0 28px}.metric{background:#fff;border:1px solid #e1e6ec;border-radius:17px;padding:20px 21px}.metric .label{color:#718096;font-size:13px;font-weight:650}.metric .value{font-size:31px;font-weight:750;letter-spacing:-1.2px;margin-top:10px}.metric .foot{font-size:12px;color:#718096;margin-top:8px}.line{border-top:1px solid #e1e7ee}.controls{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;margin:18px 0 16px}.tabs{display:inline-flex;gap:5px;background:#e9edf2;border-radius:12px;padding:4px}.tabs button{border:0;background:transparent;color:#586578;padding:10px 17px;border-radius:9px;font-weight:650}.tabs button.on{background:white;color:#192438;box-shadow:0 1px 3px #0001}.caption{color:#768497;font-size:13px}.panel{background:#fff;border:1px solid #dfe5ec;border-radius:17px;overflow:hidden}.table-scroll{overflow:auto;max-width:100%;scrollbar-color:#b4c4d8 #f4f7fa}.matrix{border-collapse:separate;border-spacing:0;min-width:max-content;width:100%;font-variant-numeric:tabular-nums}.matrix th,.matrix td{padding:16px 13px;text-align:right;white-space:nowrap;border-bottom:1px solid #e8edf2;border-right:1px solid #edf0f4;font-size:14px;min-width:78px}.matrix thead th{background:#f8fafc;font-size:13px;font-weight:750;color:#2b3a4e;position:sticky;top:0;z-index:2}.matrix th.metric-name{text-align:left;position:sticky;left:0;z-index:3;background:white;min-width:220px;max-width:220px;font-weight:650}.matrix thead th.metric-name{z-index:5;background:#f8fafc}.matrix th.avg,.matrix td.avg{background:#f6f9ff;font-weight:650}.matrix th.avg{color:#375680}.matrix tr:last-child th,.matrix tr:last-child td{border-bottom:0}.matrix tr:hover td,.matrix tr:hover th.metric-name{background:#f6faff}.good{color:#168344;font-weight:650}.bad{color:#e14b42;font-weight:650}.muted{color:#9aa5b1}.metricbutton{background:none;border:0;padding:0;color:inherit;font-weight:inherit;text-align:left}.metricbutton:hover{color:#245dc6;text-decoration:underline}.chartrow{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-top:18px}.chartpanel{background:white;border:1px solid #e1e6ed;border-radius:16px;padding:19px}.charttitle{font-size:17px;font-weight:700}.chartdetail{font-size:12px;color:#7b889a;margin-top:6px}.visual{height:200px;width:100%;margin-top:16px;display:block}.info{font-size:14px;line-height:1.65;color:#607084;margin-top:20px}.empty{display:none;text-align:center;padding:80px 20px;color:#6a7786}.empty h2{color:#253146}@media(max-width:880px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.chartrow{grid-template-columns:1fr}.wrap{padding:19px 15px 50px}.matrix th.metric-name{min-width:150px;max-width:150px}.matrix th,.matrix td{padding:15px 10px;min-width:74px}.brand{font-size:24px}}@media(max-width:390px){.summary{gap:9px}.metric{padding:15px}.metric .value{font-size:25px}.metric .label{font-size:11px}.tabs button{padding:10px 11px}}
[hidden]{display:none!important}.empty{display:block}.pill.live{background:#e9f6ef;border-color:#c8e6d3;color:#237247}
.matrix td.average-higher{color:#167344}
.matrix td.average-steady{color:#865800}
.matrix td.average-lower{color:#ba3030}
</style></head><body><main class="wrap">
<header class="top"><div><div class="brand">◉ Oura Health Tracker</div><div class="sub">Osobni pregled zdravlja</div></div><div class="actions"><span class="pill" id="connection">Provjera veze</span><a class="btn" href="/account" style="text-decoration:none">Moj račun</a><button class="btn primary" id="connect" type="button" hidden>Poveži Oura račun</button><button class="btn" id="refresh" hidden>Osvježi podatke</button></div></header>
<div class="notice" id="notice" role="status">Učitavam podatke iz tvog računa…</div>
<section class="summary" id="summary" aria-label="Posljednje vrijednosti"></section>
<div class="line"></div><div class="controls"><div class="tabs"><button type="button" class="on" data-view="daily" aria-pressed="true">Po danima</button><button type="button" data-view="monthly" aria-pressed="false">Po mjesecima</button><button type="button" data-view="trends">Trendovi</button></div><span class="caption" id="periodLabel"></span></div>
<div class="panel"><div class="table-scroll" id="tableScroll" tabindex="0" aria-label="Tablica podataka, pomiči vodoravno"><table class="matrix" id="dataTable" aria-label="Oura pregled zdravstvenih pokazatelja"></table></div><div class="empty" id="empty" hidden><h2>Još nema podataka</h2><p>Prve vrijednosti će se prikazati nakon uvoza iz Oure.</p></div></div>
<div class="chartrow" id="charts" hidden><div class="chartpanel"><div class="charttitle" id="chartTitle"></div><div class="chartdetail">Odaberi pokazatelj u tablici za njegov trend.</div><svg class="visual" id="chart" role="img" aria-label="Grafikon odabranog pokazatelja" viewBox="0 0 700 200"></svg></div><div class="chartpanel"><div class="charttitle">Pregled oporavka</div><div class="chartdetail">Prosjeci iz dostupnih noćnih mjerenja</div><div class="table-scroll"><table class="matrix" id="recovery" aria-label="Prosjeci oporavka"></table></div></div></div>
</main><script src="/dashboard.js" defer></script></body></html>
